# DSH Enter Customizer bundle patch: inserts the plugin row over the empty
# profile root (same one-insert pattern as the dsh-base bundle). The entry id is
# the settings namespace the Host half's Config schema is served under; the
# client half (exports["./client"]) is discovered through the package.json
# dsh.client declaration.
- insert:
    - id: dsh-enter-customizer
      name: dsh-enter-customizer
